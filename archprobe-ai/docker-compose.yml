services:
  postgres:
    image: postgres:16-alpine
    container_name: archprobe-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: archprobe
    ports:
      - "5432:5432"
    volumes:
      - archprobe_pg_data:/var/lib/postgresql/data
      - ./supabase/migrations/001_init_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./supabase/seed_scenarios.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d archprobe"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: archprobe-redis
    ports:
      - "6379:6379"
    volumes:
      - archprobe_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  archprobe_pg_data:
  archprobe_redis_data:
